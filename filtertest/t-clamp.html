<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; }
  .stage {
    position: relative; width: 800px; height: 450px;
    background:
      repeating-linear-gradient(45deg, #2a4d3a 0 40px, #35604a 40px 80px),
      linear-gradient(#1b2f24, #1b2f24);
  }
  /* 模拟"白字+黑描边"烧录字幕 */
  .subtitle {
    position:absolute; left:0; right:0; bottom:30px; text-align:center;
    font: bold 34px/1.3 sans-serif; color:#fff;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
      0 -2px 0 #000, 0 2px 0 #000, -2px 0 0 #000, 2px 0 0 #000;
  }
  .lens {
    position:absolute; left:25%; top:70%; width:50%; height:20%;
    backdrop-filter: url(#sbm-target);
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="sbm-target" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feComponentTransfer in="SourceGraphic" result="clamped">
      <feFuncR type="table" tableValues="0 0.1 0.2 0.3 0.4 0.45 0.45 0.45 0.45 0.45 0.45"/>
      <feFuncG type="table" tableValues="0 0.1 0.2 0.3 0.4 0.45 0.45 0.45 0.45 0.45 0.45"/>
      <feFuncB type="table" tableValues="0 0.1 0.2 0.3 0.4 0.45 0.45 0.45 0.45 0.45 0.45"/>
    </feComponentTransfer>
    <feGaussianBlur in="clamped" stdDeviation="2.5"/>
  </filter>
</svg>
<div class="stage">
  <div class="subtitle">白字黑边测试 ABC 123</div>
  <div class="lens"></div>
</div>
</body>
</html>
